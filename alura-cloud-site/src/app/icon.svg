    <circle cx="205" cy="650" r="38" />
    <circle cx="368" cy="650" r="38" />
    <circle cx="632" cy="650" r="38" />
    <circle cx="795" cy="650" r="38" />

    <circle cx="120" cy="840" r="46" />
